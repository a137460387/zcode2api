<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>zcode2api 参数农场</title>
<style>
body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px;background:#fafafa;color:#222}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
h1{font-size:18px;margin:0 0 8px}
p{font-size:13px;color:#666;margin:6px 0}
.status{font-size:14px;font-weight:600}
.ok{color:#16a34a}.bad{color:#dc2626}.warn{color:#d97706}
.log{font-family:ui-monospace,monospace;font-size:12px;background:#f5f5f5;border-radius:8px;padding:12px;max-height:220px;overflow-y:auto;margin-top:12px;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #eee}
button{padding:8px 16px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
</style></head><body>
<div class="card">
  <h1>zcode2api 参数农场</h1>
  <p>此页面在你的真实浏览器中运行阿里云无感验证，为本地代理持续供给一次性验证 param。<b>请保持此标签页打开</b>（可最小化窗口，不要休眠电脑）。</p>
  <div class="status" id="st">初始化…</div>
  <div style="margin-top:12px">
    <div class="kv"><span>已产出 param</span><b id="c-total">0</b></div>
    <div class="kv"><span>推送成功</span><b id="c-ok">0</b></div>
    <div class="kv"><span>池内 param（代理侧）</span><b id="c-pool">-</b></div>
    <div class="kv"><span>最近产出</span><b id="c-last">-</b></div>
  </div>
  <p style="margin-top:12px"><button id="btn-now">立即产出一个</button></p>
</div>
<div class="card">
  <div style="font-size:12px;color:#888;margin-bottom:8px">事件日志</div>
  <div class="log" id="log"></div>
</div>
<div id="cap-host" style="position:fixed;left:-9999px;top:0"></div>
<button id="cap-btn" style="position:fixed;left:-9999px;top:0">v</button>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<script>
const logEl = document.getElementById('log');
const stEl = document.getElementById('st');
// 日志上限：失败风暴时 DOM 会无限增长（实测曾累积 400+ 条），截断到保留最近 60 行
const LOG_MAX_LINES = 60;
let lastLine = '';
function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  lastLine = '[' + t + '] ' + msg;
  const lines = (lastLine + '\n' + logEl.textContent).split('\n');
  logEl.textContent = lines.slice(0, LOG_MAX_LINES).join('\n');
  if (cls) stEl.textContent = msg, stEl.className = 'status ' + cls;
}
let total = 0, pushed = 0, fails = 0;
let verifying = false;
let verifyStartedAt = 0;

/**
 * 带超时的 fetch。
 *
 * **这不是防御性编程，是实测缺陷的修复**：`fetch('/param')` 原本没有超时。服务被强杀
 * （taskkill /F）时那条请求的 socket 会停在半开状态、TCP 重传数分钟，`await` 一直不返回
 * → `verifyOnce` 的 `finally` 永不执行 → `verifying` 永久为 `true` → 之后每次调用都在
 * 开头 `return`，页面每 2s 空转、**一个参数都不再产出**（实测：池空 4 分钟，农场页静默）。
 * 加上超时后，这种挂死会在 8s 内变成一次可见的失败并进入退避重试。
 */
async function fetchWithTimeout(url, init, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { ...(init || {}), signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

/**
 * 把自身状态报给服务端，供管理面板显示。
 * 无头模式下用户看不到这个页面，卡住时必须让面板能说出原因。
 */
let lastReportAt = 0;
async function report(extra) {
  const now = Date.now();
  // 状态变化立即上报，否则 15s 一次（避免给服务端添无谓流量）
  const changed = extra && extra.force;
  if (!changed && now - lastReportAt < 15000) return;
  lastReportAt = now;
  try {
    await fetchWithTimeout('/farm-report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        total, pushed, fails,
        backoffMs: typeof backoffMs === 'number' ? backoffMs : 0,
        // "卡住"= 正在验证但已超过任何单轮上限（实例 15s + param 25s + 推送 8s = 48s）
        stuck: verifying && verifyStartedAt > 0 && now - verifyStartedAt > 60000,
        lastLine,
      }),
    }, 5000);
  } catch { /* 上报失败无所谓，它只是诊断 */ }
}

async function verifyOnce() {
  // 看门狗：`verifying` 若因未预料的挂起（无超时的 await、SDK 内部死锁）而长期为 true，
  // 这里强行复位，避免整个农场静默停摆——停摆比偶发一次重复验证严重得多。
  if (verifying) {
    if (verifyStartedAt && Date.now() - verifyStartedAt > 60000) {
      log('检测到上一轮验证卡死（超过 60s），已强制复位继续产出', 'warn');
      verifying = false;
    } else {
      return undefined;
    }
  }
  verifying = true;
  verifyStartedAt = Date.now();
  try {
    if (typeof window.initAliyunCaptcha !== 'function') { fails++; log('SDK 未加载（网络不通？阿里 SDK CDN 无法访问）', 'bad'); return false; }
    window.AliyunCaptchaConfig = { region: 'cn', prefix: 'no8xfe' };
    // 每次全新容器（官方逻辑：每轮验证重新 init）
    const host = document.getElementById('cap-host');
    host.innerHTML = '';
    const box = document.createElement('div'); box.id = 'cap-box-' + Date.now();
    host.appendChild(box);
    const instP = new Promise((res, rej) => { window.__ri = res; window.__rej = rej; });
    const parP = new Promise((res) => { window.__rp = res; });
    window.initAliyunCaptcha({
      SceneId: '11xygtvd', mode: 'popup', language: 'cn', showErrorTip: false,
      element: '#' + box.id, button: '#cap-btn',
      getInstance: (i) => window.__ri(i),
      success: (param) => window.__rp({ ok: true, param }),
      fail: (e) => window.__rp({ ok: false, d: JSON.stringify(e).slice(0, 200) }),
      onError: (e) => window.__rp({ ok: false, d: String(e && e.message || e).slice(0, 200) }),
    });
    const inst = await Promise.race([instP, new Promise((_, r) => setTimeout(() => r(new Error('实例超时')), 15000))]);
    if (typeof inst.startTracelessVerification !== 'function') { fails++; log('无 traceless 能力', 'bad'); return false; }
    inst.startTracelessVerification();
    const r = await Promise.race([parP, new Promise((res) => setTimeout(() => res({ ok: false, d: 'param 超时' }), 25000))]);
    if (!r.ok) { fails++; log('验证失败: ' + (r.d || ''), 'bad'); return false; }
    total++;
    document.getElementById('c-total').textContent = total;
    document.getElementById('c-last').textContent = new Date().toLocaleTimeString();
    // 推送给代理
    try {
      const res = await fetchWithTimeout('/param', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ param: r.param }),
      }, 8000);
      if (res.ok) {
        pushed++; document.getElementById('c-ok').textContent = pushed;
        lastSuccessAt = Date.now();
        log('param 产出并推送成功（' + r.param.length + ' 字符）', 'ok');
        return true;
      } else {
        // 服务在，但拒绝了这次上报（如参数格式不符）
        fails++;
        log('推送被拒绝 HTTP ' + res.status + '（param 未入池）', 'warn');
        return false;
      }
    } catch {
      // 服务不可达：该 param 只能丢弃（一次性凭据，无法重放）
      fails++;
      log('推送失败：代理服务不可达，本次 param 已丢弃', 'bad');
      return false;
    }
  } catch (e) {
    fails++;
    log('异常: ' + (e && e.message || e), 'bad');
    return false;
  } finally {
    verifying = false;
    verifyStartedAt = 0;
  }
}

// 循环：池不满时持续产出（代理通过 /param-status 告知池状态）
//
// 退避（覆盖两类失败，均为实测遇到的问题）：
// ① 代理服务不可达 —— 每 4s 硬重试会刷爆日志（实测曾累积 408 条 Failed to fetch）
// ② 验证环节失败（如断网导致阿里 SDK CDN 加载不了、实例初始化超时）——
//    同样会持续失败刷屏（实测断网时反复出现"实例超时"）
// 两类失败都按指数退避（4s → 60s），成功后立即复位。
let backoffMs = 0;
const BACKOFF_MAX = 60000;
let lastSuccessAt = Date.now();
let failsAtLastReload = 0;
let lastReloadAt = 0;

/**
 * 失败循环自愈：整页重载。
 *
 * 实测场景：连续验证失败拿到 F001（阿里云风控/自动化判定）后，这个页面的 SDK 状态就
 * "卡"在失败态——退避到 60s 仍一直 F001，**一个参数都产不出来**，而面板只能显示
 * "池是空的"。整页重载会重新加载 SDK、重新初始化实例，实测能恢复正常产出。
 *
 * 两道闸门避免"失败即重载"变成重载风暴：
 * - 距上次成功已超过 2 分钟，且期间至少失败 6 次（偶发单次失败不值得重载）；
 * - 距上次重载已超过 5 分钟（重载后若仍失败，说明不是页面状态问题，别再刷）。
 */
function maybeReloadOnFailureLoop() {
  const now = Date.now();
  if (now - lastSuccessAt < 120000) return;
  if (fails - failsAtLastReload < 6) return;
  if (now - lastReloadAt < 300000) return;
  failsAtLastReload = fails;
  lastReloadAt = now;
  log('连续失败且已 ' + Math.round((now - lastSuccessAt) / 1000) + 's 无成功产出，整页重载以复位 SDK 状态', 'warn');
  report({ force: true }).finally(() => { try { location.reload() } catch (e) { /* 忽略 */ } });
}

async function loop() {
  for (;;) {
    let pool = null;
    let usable = null;
    let newestAgeMs = null;
    let reachable = false;
    try {
      const res = await fetchWithTimeout('/param-status', {}, 5000);
      if (res.ok) {
        const s = await res.json();
        pool = s.pool;
        // 优先用 usable（还能被上游接受的个数）；老版本服务没有这个字段时回退到 pool
        usable = s.usable ?? s.pool;
        newestAgeMs = s.newestAgeMs ?? null;
        reachable = true;
      }
    } catch { /* 服务不可达（含 5s 超时） */ }
    document.getElementById('c-pool').textContent = reachable
      ? (pool + (usable != null && usable !== pool ? '（可用 ' + usable + '）' : '') + (newestAgeMs != null ? '（最新 ' + Math.round(newestAgeMs / 1000) + 's）' : ''))
      : '服务未连接';

    if (!reachable) {
      // 只在状态变化时记一条日志（不刷屏）
      if (backoffMs === 0) log('代理服务不可达（' + new URL('/param-status', location.href).origin + '）——等待恢复，期间不产出 param', 'bad');
      backoffMs = Math.min(backoffMs ? backoffMs * 2 : 4000, BACKOFF_MAX);
    } else {
      if (backoffMs > 0) { log('连接已恢复', 'ok'); backoffMs = 0; }
      /*
       * 产出判据：**可用参数**不足 TARGET_POOL 就补货。
       *
       * 这是"按需产出"而不是"定时滴灌"。曾经的判据是"最新参数超过 FRESH_MS(20s) 就产一个"，
       * 于是稳态变成每 20s 必产一个（约 180 次/小时），与池里有没有无关——空转时也在持续
       * 做验证。实测这样跑到约 25 次后被阿里云风控判 F001，之后一个参数都产不出来。
       *
       * 用 `usable` 而不是 `pool` 是关键：池里 6 个全陈时 pool=6 看着健康，实际一个都不能用；
       * 服务端的 ParamPool 现在也会主动丢弃过时效的参数（不再递给上游换 3007）。
       */
      const TARGET_POOL = 2;
      const needCount = usable != null && usable < TARGET_POOL;
      if (needCount) {
        const ok = await verifyOnce();
        // 验证失败（断网/SDK 加载失败/被风控等）也要退避，避免持续失败刷屏与白耗请求
        if (ok === false) {
          backoffMs = Math.min(backoffMs ? backoffMs * 2 : 8000, BACKOFF_MAX);
          if (backoffMs > 8000) log('验证连续失败，退避 ' + Math.round(backoffMs / 1000) + 's 后重试（检查网络与阿里 SDK 是否可访问）', 'warn');
        } else {
          backoffMs = 0;
        }
      }
      maybeReloadOnFailureLoop();
    }
    await report();
    await new Promise((r) => setTimeout(r, backoffMs || 2000));
  }
}
document.getElementById('btn-now').onclick = verifyOnce;
window.addEventListener('load', () => { log('农场页就绪，SDK: ' + (typeof window.initAliyunCaptcha === 'function' ? '已加载' : '加载中…'), 'ok'); report({ force: true }); loop(); });
</script></body></html>
